version: '3.9'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: admin-dashboard-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: admin-dashboard
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./server/scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - admin-dashboard-network
    ulimits:
      memlock: -1
    command: ["--setParameter", "maxIndexBuildMemoryUsageMegabytes=1000", "--wiredTigerCacheSizeGB", "1"]

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: admin-dashboard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - admin-dashboard-network

  # Backend API Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    container_name: admin-dashboard-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/admin-dashboard?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRE: 7d
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      JWT_REFRESH_SECRET: your-refresh-secret-key
      JWT_REFRESH_EXPIRE: 30d
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USER: your-email@gmail.com
      EMAIL_PASS: your-app-password
      EMAIL_FROM: noreply@admin-dashboard.com
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      BCRYPT_ROUNDS: 12
      SESSION_SECRET: your-session-secret-key
      LOG_LEVEL: info
    ports:
      - "5001:5000"
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/logs:/app/logs
    depends_on:
      - mongodb
      - redis
    networks:
      - admin-dashboard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React App
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
    container_name: admin-dashboard-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
      VITE_WS_URL: ws://localhost:3000
    ports:
      - "3000:80" # expose nginx port
    depends_on:
      - backend
    networks:
      - admin-dashboard-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (optional, if you want custom configs in front of frontend)
  nginx:
    image: nginx:alpine
    container_name: admin-dashboard-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - admin-dashboard-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  admin-dashboard-network:
    driver: bridge
